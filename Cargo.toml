[workspace]
resolver = "2"
members = ["protocol", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["rootkill-g <rootkill.dedsec@gmail.com>"]
repository = "https://github.com/rootkill-g/wire-whisper"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
papaya = "0.2"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev-only.
proptest = "1"

whisper-protocol = { path = "protocol" }
whisper-server = { path = "server" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
